version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/portfolio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # À partir de 5.3, react-icons retire les icônes de marque Microsoft (SiCsharp, SiVisualstudio,
      # SiMicrosoftazure…) utilisées par SkillBadge : la mise à jour casse le build. À lever en
      # remplaçant ces icônes (autres familles de react-icons ou SVG locaux).
      - dependency-name: "react-icons"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
